		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();

- If <mark style="background: #ADCCFFA6;">_the process generating the data is spatial in nature_</mark>, for example, the incidence of certain diseases in humans may depend on environmental pollution; 
- if <mark style="background: #ADCCFFA6;">_the spatial component does not directly affect the original modelling data, but introducing it can significantly improve the quality of the model</mark>_.

<div class="" style="position: absolute; left: 10%; top: 0%; height: 50%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

`$P_{i} = \alpha+\sum_kX_{ik}\beta_{k}+\epsilon_{i}$`
</div>

<div class="block">

<div class="" style="position: absolute; left: 0%; top: 15%; height: 90%; width: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left">

where `$P_{i}$` - dependent variable; 
`$X$` - independent variables; 
`$\beta$` - regression coefficients; 
`$\alpha$` - constant, usually indicating the value of the dependent variable when all independent variables are zero.

This is **regression without the spatial component, hereafter simply referred to as standard regression**.
</div>
</div>

## Feature engineering
<!-- .element: style="font-size: 40px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center" align="center" -->
</div>

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

In this approach, <mark style="background: #ABF7F7A6;">variables calculated based on the spatial location of objects</mark> are simply introduced into the regression model.

For example, a variable indicating the proximity of an object to the town centre or the proximity of some services.

This variable can be called a **_spatially patterned omitted variable (spatially patterned omitted covariate)_** - it is geographical information that allows us to improve the prediction of our model.
</div>

<!-- .element: style="font-size: 30px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

<div class="" style="position: absolute; left: 0%; top: -15%; height: 50%; width: 80%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

## Spatial heterogeneity
<!-- .element: style="font-size: 45px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center" align="center" -->
</div>

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

At its most basic, _spatial heterogeneity_ means that parts of the <mark style="background: #ADCCFFA6;">model may vary systematically with geography, change in different places</mark>.
</div>

<!-- .element: style="font-size: 40px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="block">

https://geographicdata.science/book/notebooks/11_regression.html#bringing-space-into-the-regression-framework
</div>

 <!-- .element: style="font-size: 10px" -->



<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

For example, a change in the independent coefficient may reflect that different areas have different baseline impacts of the process being studied, while a change in the coefficients of the variables may mean that <mark style="background: #ADCCFFA6;">there is some indirect geographical factor affecting the interaction between the dependent and independent variables</mark> (e.g. some restriction on land use in certain parts of the city).
</div>

<!-- .element: style="font-size: 40px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

The presence of spatial heterogeneity when using a standard regression model can lead to

- errors in estimating the level of significance; 
- bias in parameter estimates; 
- suboptimal predictions; 
- the detection of relationships that do not exist in reality; 
- the false impression that the results apply to the whole dataset (globally), when the model may only be accurate for certain regions.
</div>

<!-- .element: style="font-size: 30px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

Spatial heterogeneity can be:

- **discrete** - where there are predetermined zones (spatial regimes) in which heterogeneity exists and the properties of the model, its parameters and coefficients are free to vary; 
- **continuous** where the regression coefficients vary freely in space (no predetermined zones are required) - *geographically weighted regression*.

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

An approach to account for discrete heterogeneity where different coefficients are calculated for different subsets of the dataset based on different regression models.
</div>

##   Spatial fixed effects
</div>

<!-- .element: style="font-size: 30px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center" align="center" -->
</div>

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

<mark style="background: #ADCCFFA6;">The influence of spatial fixed effects is typically accounted for by the free term of the regression model 𝛼.</mark>

<div class="callout callout-color2">
<div class="callout-title">
<div class="callout-icon">

<i class="fas fa-fire-alt" ></i>


</div>
<div class="callout-title-inner">

When included in a regression model, it is possible that factors affecting the dependent variable are overlooked, but it can be assumed that they vary systematically across space. 

</div>
</div>
<div class="callout-content">

When building the model, we can account for these implicit variables by introducing binary variables based on a spatial rule (i.e. assigning 1 to facilities located in a particular neighbourhood and 0 to the rest).

</div>
</div>
</div>

<!-- .element: style="font-size: 28px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

When using fixed effects, we assume that the <mark style="background: #ADCCFFA6;">_dependent variable does not vary uniformly in space, but with some pattern_</mark>.

In this case, **only the free variable of the model equation changes, and all other coefficients remain constant over the entire range**.

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

Regression equation hence changes to:

`$P_{i} = \alpha_{r} + \sum_kX_{ik}\beta_{k} + \epsilon_{i}$`,

where `$\alpha_{r}$` may vary depending on district (for example).

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

**The introduction of spatial fixed effects allows us to control for <mark style="background: #ADCCFFA6;">hidden effects that are geographically distributed, meaning that we partially isolate the effects of variables.</mark>**

</div>

<div class="block">

`$P_{i} = \alpha_{r} + \sum_kX_{ik}\beta_{k-r} + \epsilon_{i}$`,

</div>

 <!-- .element: style="font-size: 32px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center" align="center" -->

</div>
</div>

<div class="" style="position: absolute; left: 0%; top: 10%; height: 50%; width: 30%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

</div>


##  Geographically weighted regression
</div>

<!-- .element: style="font-size: 35px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->
</div>


<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

A **local form of a linear regression model used to detect heterogeneity and analyse changing spatial relationships.** 

It is a local model of the dependent variable, where the coefficients are allowed to vary in space by fitting a weighted linear regression model to each spatial object.

</div>

<!-- .element: style="font-size: 35px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

`$P_{i} = \alpha + \beta_{1i}x_{1i}+\beta_{2i}x_{2i}+...+ \beta_{mi}x_{mi}+\epsilon_{i}$`

где 
- `$i=1,...,n$`
- `$n$` - total number of observations
- `$P_{i}$` - dependent variable
- `$x_{mi}$` - observed value of independent variable
- `$\alpha$` - free variable
- `$\beta_{1i},\beta_{2i},...,\beta_{mi}$` - coefficients
- `$m$` - total number of independent variables 
- `$\epsilon_{i}$` - error
</div>

<!-- .element: style="font-size: 35px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

`$\beta_{i}=(X^TW_{i}X)^{-1}X^{T} W_{i}P$`
- `$P$` - dependent variable vector 
- `$X$` - matrix with `$n$` observations for `$m$` independent variables 
- `$W_{i}$` - matrix `$n \times n$`, elements of which show weights for location `$i$`
<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

> **Spatial heterogeneity is the effect of phenomena that are directly and explicitly related in position in space, leading to clustering and spatial variation**.
> In some cases we also consider the effect of spatial configuration.
</div>

<!-- .element: style="font-size: 36px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

</div>


## Spatial dependence
</div>

<!-- .element: style="font-size: 46px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

Spatial dependence <mark style="background: #ADCCFFA6;">shows how the environment affects the variable under study</mark>. Such effects are quite different from spatial heterogeneity and are due to the influence of the environment, i.e. it is not directly the location of objects in space, but their relationship to other objects in the dataset and their spatial position relative to each other.

The phenomenon whereby the values of observations are related to each other by distance is called **spatial dependence**.

</div>

<!-- .element: style="font-size: 36px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

If spatial autocorrelations are present in the data and a standard regression model is used, then
- correlation coefficients will be biased upwards; 
- the coefficient of determination will be biased upwards, leading the researcher to believe that there is a stronger relationship than there actually is; 
- standard errors and variance will be biased downwards; 
- precision will be exaggerated; 
- it is possible to erroneously conclude that there is a relationship that does not exist.
</div>

<!-- .element: style="font-size: 34px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

There are several ways to account for spatial dependence, the common denominator is the way in which space is implemented - <mark style="background: #ADCCFFA6;">_spatial weight matrix_</mark>.

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

</div>


## Exogenous effects (SLX model)
</div>

<!-- .element: style="font-size: 46px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->
<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

The simplest way to introduce spatial dependence into a regression model is to <mark style="background: #ADCCFFA6;">include not only the variable itself, but also its spatial lag</mark>.

Let's include the spatial lag in the regression model:
  
`$P_{i} = \alpha + \sum_{k=1}^pX_{ij}\beta_{i} + \sum_{k=1}^p\left(\sum_{j=1}^Nw_{ij}x_{jk}\right)\gamma_{k} + \epsilon_{i}$`

where `$\sum_{j=1}^Nw_{ij}x_{jk}$` - spatial lag of independent variable.

</div>

<!-- .element: style="font-size: 34px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

With spatial weights matrix it can be transformed in matrix form:

`$P_{i} = \alpha + X\beta + WX\gamma + \epsilon$`.

<div class="callout callout-color-default">
<div class="callout-title">
<div class="callout-icon">

<i class="fas fa-pencil-alt" ></i>


</div>
<div class="callout-title-inner">

We will therefore focus on the two main coefficients of the model: `$\beta$` and `$\gamma$`.

</div>
</div>
<div class="callout-content">

`$\beta$` shows how much the dependent variable changes when the independent variable `$X_{ik}$` changes by 1.

</div>
</div>

</div>

<!-- .element: style="font-size: 40px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

<div class="callout callout-color-default">
<div class="callout-title">
<div class="callout-icon">

<i class="fas fa-pencil-alt" ></i>


</div>
<div class="callout-title-inner">

The `$\gamma$` coefficient shows the same indirect relationship between `$X_{i}$` and the dependent variable.

</div>
</div>
<div class="callout-content">

The simplest interpretation of this effect is that we are *accounting for the relationship between the rental price and changes in the neighbourhood of the property*. In fact, a change in the rental price will cause a 'spillover' in the neighbourhood of the property, as it will cause a change in the spatial lag.

</div>
</div>

</div>

<!-- .element: style="font-size: 40px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<mark style="background: #ADCCFFA6;">The specific magnitude of the change in spatial lag will depend on the structure of the spatial weights matrix</mark>. 
<div class="block">

For example, for an object with a large number of neighbours, a change in the value of one of them will cause a small change in the spatial lag, because the object will be affected by all its neighbours at the same time. On the other hand, for an object with only one neighbour, a change in the value of one of its neighbours will cause exactly the same change in the spatial lag, because the object is not affected by any other objects.

</div>

<!-- .element: style="font-size: 32px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

</div>


## Spatial error
</div>

<!-- .element: style="font-size: 46px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center" align="center" -->

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

A spatial lag is included in the error in the linear regression equation when spatial errors are used:

`$P_{i} = \alpha + \sum_k\beta_{k}X_{ki}+ u_{i}$`,

`$u_{i} = \lambda u_{lag-i} + \epsilon_{i}$`,

где `$u_{lag-i} = \sum_{j}w_{i,j}u_{j}$`.

>**This contradicts the standard notion of linear regression model error** and leads to the need for alternative methods of model estimation.
</div>

<!-- .element: style="font-size: 30px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

</div>


## Spatial lag model
</div>

<!-- .element: style="font-size: 50px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; justify-content: center" align="center" -->

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

<img src="logo_osnovnoy_russkiy_chernyy.jpg" alt="" style="object-fit: scale-down">

</div>

<div class="block">

The spatial lag model includes spatial lag as a dependent variable, which can be expressed as a formula:

`$P_{i} = \alpha + \rho P_{lag-i} + \sum_k\beta_{k}X_{ki} + \epsilon_{i}$`.

<div class="" style="position: absolute; left: 0%; top: 95%; height: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

© 2025 Балтыжакова Т.И.<!-- .element: style="font-size: 10px" -->
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 80%; top: 0%; height: 10%; width: 20%; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-evenly" align="right">

</div>

<div class="" style="position: absolute; left: 0%; top: 0%; height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center" >

This model **contradicts the exogeneity assumption, i.e. in this equation a change in the dependent variable causes a change in the independent variable**. Under this assumption, the relationship only works in one direction: the independent variables affect the dependent variable.

In our case, this assumption is violated because `$P_{i}$` exists on both sides of the equals sign.

</div>

<!-- .element: style="font-size: 32px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-evenly" align="left" -->

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="block">

The linear regression model obtained is not of high quality, with a coefficient of determination of 0.33.

However, it is possible that this model does not take into account significant factors that are not explicit, such as the location in the city centre.
